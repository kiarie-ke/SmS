name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_system
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://school:school@localhost:5435/school_system?schema=public
      - run: pnpm seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://school:school@localhost:5435/school_system?schema=public
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
