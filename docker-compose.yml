services:
  db:
    image: postgres:16-alpine
    container_name: school-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school_system
    ports:
      - '5435:5432'
    volumes:
      - school_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U school -d school_system']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  school_pgdata:
